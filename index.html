<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' mailto:; upgrade-insecure-requests">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <title>Marty - Thumbnail Designer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-wrapper">
        <div class="mountain-layer layer-1"></div>
        <div class="mountain-layer layer-2"></div>
        <div class="mountain-layer layer-3"></div>
    </div>

    <div class="container">
        
        <div id="home-page" class="fade-in">
            <img src="locked.png" alt="Marty PFP" class="pfp">
            
            <h1>Marty</h1>
            <p class="subtitle">Professional Minecraft Thumbnail Designer</p>
            
            <div style="text-align: center;">
                <button id="show-portfolio-btn" class="btn" type="button">Thumbnails</button>
                <a href="contact.html" class="btn" style="display: inline-block; margin-left: 10px; text-decoration: none;">Contact & Pricing</a>
            </div>
        </div>

        <div id="portfolio-page" class="fade-in">
            <div style="text-align: center;">
                <button id="show-home-btn" class="btn btn-back" type="button">‹ Back</button>
            </div>

            <div class="gallery-item">
                <img src="thumbnail.jpg" alt="ArchMC Thumbnail" class="gallery-img">
                <div class="caption">Hacking on ArchMC</div>
            </div>

            <div class="gallery-item">
                <img src="cyemerthumb.jpg" alt="Cyemer Thumbnail" class="gallery-img">
                <div class="caption">Cyemer Client</div>
            </div>

            <div class="gallery-item">
                <img src="banner.png" alt="Banner Design" class="gallery-img">
                <div class="caption">Banner Design</div> 
            </div>

            <div class="gallery-item">
                <img src="dewieronmyauclient.jpg" alt="Dewier on Myau" class="gallery-img">
                <div class="caption">Dewier on Myau</div> 
            </div>

            <div class="gallery-item">
                <img src="W.png" alt="Ultimate Myau Client Test" class="gallery-img">
                <div class="caption">Ultimate Myau Client Test on Ranked Bedwars</div> 
            </div>

            <div class="gallery-item">
                <img src="img.png" alt="New Design" class="gallery-img">
                <div class="caption">Mario goes to Maccas</div> 
            </div>

        </div>

        <div class="copyright">
            © marty-on-linux
        </div>

    </div>

    <script>
        function showPortfolio() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('portfolio-page').style.display = 'block';
            window.scrollTo(0, 0); 
        }

        function showHome() {
            document.getElementById('portfolio-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            window.scrollTo(0, 0);
        }

        document.getElementById('show-portfolio-btn').addEventListener('click', showPortfolio);
        document.getElementById('show-home-btn').addEventListener('click', showHome);
    </script>

</body>
</html>
