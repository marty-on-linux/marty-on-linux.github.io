<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marty - Thumbnail Designer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-container">
        <div class="mountain layer-1"></div>
        <div class="mountain layer-2"></div>
        <div class="mountain layer-3"></div>
    </div>

    <div class="container">
        
        <div id="home-page" class="fade-in">
            <img src="locked.png" alt="Marty PFP" class="pfp">
            
            <h1>Marty</h1>
            <p class="subtitle">Professional Minecraft Thumbnail Designer</p>
            
            <button class="btn" onclick="showPortfolio()">Thumbnails</button>
        </div>

        <div id="portfolio-page" class="fade-in">
            <button class="btn btn-back" onclick="showHome()">‹ Back</button>

            <div class="gallery-item">
                <img src="thumbnail.jpg" alt="ArchMC Thumbnail" class="gallery-img">
                <div class="caption">ArchMC</div>
            </div>

            <div class="gallery-item">
                <img src="cyemerthumb.jpg" alt="Cyemer Thumbnail" class="gallery-img">
                <div class="caption">Cyemer Client</div>
            </div>
        </div>

    </div>

    <div class="copyright-container">
        © marty-on-linux
    </div>

    <script>
        function showPortfolio() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('portfolio-page').style.display = 'block';
            window.scrollTo(0, 0); 
        }

        function showHome() {
            document.getElementById('portfolio-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
