<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marty - Thumbnail Designer</title>
    <style>
        /* --- 1. FONTS --- */
        /* latin */
        @font-face {
          font-family: 'Carter One';
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url(https://fonts.gstatic.com/s/carterone/v18/q5uCsoe5IOB2-pXv9UcNExN8hA.woff2) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* --- 2. GLOBAL STYLES --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif; /* Fallback for body text */
            background-color: #1a1528; /* Deep purple base */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Prevents scrollbars from the moving background */
            position: relative;
        }

        /* --- 3. MOVING MOUNTAIN BACKGROUND --- */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Puts it behind everything */
            overflow: hidden;
            background: linear-gradient(180deg, #3d2c61 0%, #1a1528 100%);
        }

        .mountain {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%; /* Double width for seamless looping */
            height: 50%;
            background-repeat: repeat-x;
            background-size: 50% 100%;
        }

        /* Back Layer (Slowest, Darkest) */
        .layer-1 {
            height: 60%;
            background-image: linear-gradient(135deg, #2b2046 25%, transparent 25%), 
                              linear-gradient(225deg, #2b2046 25%, transparent 25%);
            background-size: 100px 100%; /* Size of peaks */
            background-position: 0 0;
            opacity: 0.6;
            animation: moveLeft 40s linear infinite;
        }

        /* Middle Layer */
        .layer-2 {
            height: 40%;
            background-image: linear-gradient(135deg, #382a5c 25%, transparent 25%), 
                              linear-gradient(225deg, #382a5c 25%, transparent 25%);
            background-size: 150px 100%;
            background-position: 0 0;
            opacity: 0.8;
            animation: moveLeft 25s linear infinite;
        }

        /* Front Layer (Fastest, Lighter) */
        .layer-3 {
            height: 25%;
            background-image: linear-gradient(135deg, #4b367c 25%, transparent 25%), 
                              linear-gradient(225deg, #4b367c 25%, transparent 25%);
            background-size: 200px 100%;
            background-position: 0 0;
            animation: moveLeft 15s linear infinite;
        }

        @keyframes moveLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- 4. CONTENT CARD --- */
        .container {
            position: relative;
            z-index: 10; /* Ensures content is above mountains */
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 20px;
        }

        /* --- 5. PROFILE PICTURE --- */
        .pfp {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4b367c;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            background-color: #000; /* Fallback if transparent */
        }

        /* --- 6. TYPOGRAPHY --- */
        h1 {
            font-family: 'Carter One', cursive; /* Applied requested font */
            font-size: 48px;
            margin: 0;
            letter-spacing: 1px;
            text-transform: capitalize;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        p.subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #e0e0e0;
            margin-top: 10px;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- 7. BUTTONS --- */
        .btn {
            background-color: #5e449b;
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #6f52b8;
            font-size: 18px;
            font-family: 'Carter One', cursive; /* Font on button too */
            box-shadow: 0 5px 0 #3d2c61; /* 3D button effect */
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #6f52b8;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #3d2c61;
        }

        .btn-back {
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 16px;
            margin-bottom: 20px;
            color: #ccc;
            padding: 5px 10px;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.1);
            transform: none;
            color: white;
        }
        .btn-back:active { transform: none; box-shadow: none; }

        /* --- 8. GALLERY --- */
        .gallery-item {
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 25px;
            transition: transform 0.2s;
            backdrop-filter: blur(5px);
        }

        .gallery-item:hover {
            transform: scale(1.02);
            border-color: #5e449b;
        }

        .gallery-img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        .caption {
            font-family: 'Carter One', cursive;
            font-size: 24px;
            margin-top: 15px;
            margin-bottom: 5px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* --- 9. ANIMATIONS --- */
        #portfolio-page { display: none; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="background-container">
        <div class="mountain layer-1"></div>
        <div class="mountain layer-2"></div>
        <div class="mountain layer-3"></div>
    </div>

    <div class="container">
        
        <div id="home-page" class="fade-in">
            <img src="locked.png" alt="Marty PFP" class="pfp">
            
            <h1>Marty</h1>
            <p class="subtitle">Professional Minecraft Thumbnail Designer</p>
            
            <button class="btn" onclick="showPortfolio()">Thumbnails</button>
        </div>

        <div id="portfolio-page" class="fade-in">
            <button class="btn btn-back" onclick="showHome()">‹ Back</button>

            <div class="gallery-item">
                <img src="thumbnail.jpg" alt="ArchMC Thumbnail" class="gallery-img">
                <div class="caption">ArchMC</div>
            </div>

            <div class="gallery-item">
                <img src="cyemerthumb.jpg" alt="Cyemer Thumbnail" class="gallery-img">
                <div class="caption">Cyemer Client</div>
            </div>
        </div>

    </div>

    <script>
        function showPortfolio() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('portfolio-page').style.display = 'block';
        }

        function showHome() {
            document.getElementById('portfolio-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
        }
    </script>

</body>
</html>
