<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marty - Thumbnail Designer</title>
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif; /* Similar to the font in your screenshot */
            background: linear-gradient(180deg, #2b2046 0%, #1a1528 100%); /* Dark Purple Gradient */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- CONTAINER --- */
        .container {
            width: 100%;
            max-width: 450px; /* Limits width to look like a mobile card */
            text-align: center;
            padding: 20px;
        }

        /* --- PROFILE PICTURE (Page 1) --- */
        .pfp {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Makes it a circle */
            object-fit: cover;
            border: 4px solid #3d2c61; /* Subtle purple border */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 42px;
            margin: 0;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: lowercase; /* Matches the 'seventyy' style */
        }

        p.subtitle {
            font-size: 14px;
            color: #dcdcdc; /* Slightly grey white */
            margin-top: 10px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* --- BUTTONS --- */
        .btn {
            background-color: #4b367c;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: none;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #5e449b;
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* --- PORTFOLIO GALLERY (Page 2) --- */
        .gallery-item {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 25px;
            transition: transform 0.2s;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        .caption {
            font-size: 20px;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 5px;
            color: white;
        }

        /* --- PAGE SWITCHING LOGIC --- */
        #portfolio-page {
            display: none; /* Hidden by default */
        }
        
        /* Fade animation */
        .fade-in {
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="container">
        
        <div id="home-page" class="fade-in">
            <img src="locked.jpg" alt="Marty PFP" class="pfp">
            
            <h1>Marty</h1>
            <p class="subtitle">Professional Minecraft Thumbnail Designer</p>
            
            <button class="btn" onclick="showPortfolio()">Thumbnails</button>
        </div>

        <div id="portfolio-page" class="fade-in">
            <button class="btn btn-back" onclick="showHome()">‹ Back</button>

            <div class="gallery-item">
                <img src="thumbnail.jpg" alt="ArchMC Thumbnail" class="gallery-img">
                <div class="caption">ArchMC</div>
            </div>

            <div class="gallery-item">
                <img src="cyemerthumb.jpg" alt="Cyemer Thumbnail" class="gallery-img">
                <div class="caption">Cyemer Client</div>
            </div>
        </div>

    </div>

    <script>
        // Simple script to switch pages without reloading
        function showPortfolio() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('portfolio-page').style.display = 'block';
        }

        function showHome() {
            document.getElementById('portfolio-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
        }
    </script>

</body>
</html>
